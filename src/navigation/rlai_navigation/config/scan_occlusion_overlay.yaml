# Opt-in planning reservation behind opaque finite scan returns.
# Hypotheses mark only; original /scan rays provide clearing evidence.
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: rlai_costmap_plugins::RayObstacleLayer
        observation_sources: scan occlusion
        occlusion:
          topic: /scan_occlusion/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.25
          obstacle_max_range: 8.0
          observation_persistence: 0.0
          expected_update_rate: 0.6
